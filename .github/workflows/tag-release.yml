# Tag the version a push to main carries, then release it.
#
# On a push that changes the host project, the pushed head is tagged `v<its host <Version>>` unless that tag
# already exists, so nobody tags by hand. Only the head: GitHub treats a new tag as creating every workflow
# file that differs from main's tip, and the workflow token can never hold the `workflows` permission, so
# tagging an older commit was refused with a 403 the first time a workflow changed after the bump (2026-10-01).
# A push that bumps twice releases only the newer version.
#
# A tag pushed with the workflow token starts no other workflow, which is GitHub's guard against loops, so
# release.yml and docker-publish.yml are called directly with the tag rather than triggered by it.
name: Tag and release

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/DlnaServer.Host/DlnaServer.Host.csproj"
      # So a change to this file is exercised, and a version a failed run left untagged gets tagged.
      - ".github/workflows/tag-release.yml"

permissions:
  contents: read

# Two pushes racing could both see a version as untagged.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the pushed version
    runs-on: ubuntu-latest

    permissions:
      # Creating the tag through the API.
      contents: write

    outputs:
      tags: ${{ steps.tag.outputs.tags }}

    steps:
      # The tags are needed to see whether this version is already tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the pushed version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/DlnaServer.Host/DlnaServer.Host.csproj | head -n 1)
          tag="v${version}"
          if [ -z "${version}" ] || git rev-parse --quiet --verify "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists or no version found, nothing to tag"
            echo "tags=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${tag}" -f message="${tag}" -f object="${HEAD_SHA}" -f type=commit --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${object}" > /dev/null
          echo "Tagged ${HEAD_SHA} as ${tag}"
          echo "tags=[\"${tag}\"]" >> "${GITHUB_OUTPUT}"

  # A matrix of at most one tag.
  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tags != '[]'
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.tag.outputs.tags) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] - see workflows README
    with:
      tag: ${{ matrix.tag }}

  image:
    name: Image
    needs: [ tag, release ]
    if: needs.tag.outputs.tags != '[]'
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.tag.outputs.tags) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml # zizmor: ignore[self-repository] - see workflows README
    with:
      tag: ${{ matrix.tag }}
