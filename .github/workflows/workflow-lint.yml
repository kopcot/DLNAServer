# Lint the workflow files themselves.
#
# actionlint catches what GitHub only reports once a run fails - a bad expression, a wrong input name, a
# shell error in a run block. zizmor catches what never fails at all - an untrusted value expanded into a
# script, a token wider than the job needs, credentials left in .git/config.
name: Workflow lint

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # advanced-security: false - findings fail this job and are printed in its log, so it needs no
      # security-events permission and works the same on a pull request from a fork.
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
