# OpenSSF Scorecard - scores the repository's supply-chain posture (pinned actions, token permissions,
# branch protection, dependency updates) and reports each failing check in the Security tab.
#
# publish_results makes the score public at securityscorecards.dev, which the action requires for the
# id-token it signs the results with. The repository is public, so nothing is exposed that was not already.
name: Scorecard

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 5 * * 4"
  # Re-score as soon as branch protection changes, since it is one of the checks.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
