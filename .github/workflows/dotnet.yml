# Build, verify and test the solution.
#
# The repository documents two hard invariants - the build stays at 0 warnings and no package carries a
# known advisory. Both are enforced here rather than left to whoever last ran a local build.
name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # global.json pins the SDK band the NAS runs, so CI resolves the same one rather than whatever
      # the runner happens to carry.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DlnaServer.sln

      # Analyzers and EnforceCodeStyleInBuild cover the rules the compiler knows about; this covers
      # whitespace, using ordering and the rest of the .editorconfig that only the formatter applies.
      - name: Verify formatting
        run: dotnet format DlnaServer.sln --verify-no-changes --no-restore --verbosity diagnostic

      # Release, because that is what the NAS and the container run - SatelliteResourceLanguages and the
      # GC properties in DlnaServer.Host.csproj only take effect there.
      - name: Build
        run: dotnet build DlnaServer.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test DlnaServer.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 14

  container:
    name: Container builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build only - nothing is pushed. The image is multi-stage and installs ffmpeg from Debian, so a
      # broken base image or a missing package surfaces here rather than on the next deploy.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
