# Build, verify and test the solution.
#
# The repository documents two hard invariants - the build stays at 0 warnings and no package carries a
# known advisory. Both are enforced here rather than left to whoever last ran a local build.
name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the running job pointless. The literal keeps this apart from the
# other workflows full-suite.yml calls, since github.workflow is then the caller's name.
concurrency:
  group: ${{ github.workflow }}-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Windows because it is the development box and paths are where the two differ - ExcludeFolders takes
    # either separator, and a test that only ever ran on Linux cannot show that both work.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      # persist-credentials: false - nothing in this job pushes to the repository, so the token has no
      # reason to sit in .git/config for the rest of the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # global.json pins the SDK band the NAS runs, so CI resolves the same one rather than whatever
      # the runner happens to carry.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DlnaServer.sln --locked-mode

      # Analyzers and EnforceCodeStyleInBuild cover the rules the compiler knows about; this covers
      # whitespace, using ordering and the rest of the .editorconfig that only the formatter applies.
      # Once is enough - the sources are identical on both runners.
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format DlnaServer.sln --verify-no-changes --no-restore --verbosity diagnostic

      # Release, because that is what the NAS and the container run - SatelliteResourceLanguages and the
      # GC properties in DlnaServer.Host.csproj only take effect there.
      - name: Build
        run: dotnet build DlnaServer.sln --configuration Release --no-restore -warnaserror

      # The admin UI tests drive headless Chrome and run on Linux only: the Windows leg is here for path
      # handling, which they do not exercise, so it filters them out (ADR 0038).
      - name: Test
        shell: bash
        env:
          TEST_FILTER: ${{ runner.os == 'Windows' && 'FullyQualifiedName!~DlnaServer.UiTests' || '' }}
        run: >
          dotnet test DlnaServer.sln
          --configuration Release
          --no-build
          ${TEST_FILTER:+--filter "$TEST_FILTER"}
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # Published as the run's job summary - GitHub's own reporting, so no third-party account or token.
      # One runner is enough: the same tests cover the same code on both.
      - name: Summarise coverage
        if: runner.os == 'Linux'
        uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # 5.5.12
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/coverage-report
          reporttypes: MarkdownSummaryGithub

      - name: Publish coverage summary
        if: runner.os == 'Linux'
        run: cat TestResults/coverage-report/SummaryGithub.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          retention-days: 14
