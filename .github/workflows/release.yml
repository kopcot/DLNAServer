# Publish the deployable artifact for a tagged version.
#
# Tag with the version carried by Directory.Build.props, prefixed with `v` - `v1.1.0917`. The archive is
# the same framework-dependent linux-x64 publish NasBuild.sh produces by hand, so what a release contains
# is reproducible instead of being whatever was on the maintainer's machine that day.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  publish:
    name: Publish linux-x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DlnaServer.sln

      # The release must not ship something the build gate would have rejected.
      - name: Build and test
        run: |
          dotnet build DlnaServer.sln --configuration Release --no-restore -warnaserror
          dotnet test DlnaServer.sln --configuration Release --no-build

      # Mirrors NasBuild.sh: framework-dependent, because the NAS carries the .NET 8 runtime.
      - name: Publish
        run: >
          dotnet publish src/DlnaServer.Host
          --configuration Release
          --runtime linux-x64
          --no-self-contained
          --output publish
          -p:Deterministic=true
          -p:InvariantGlobalization=true

      - name: Archive
        run: |
          cd publish
          zip -r "../DlnaServer-${GITHUB_REF_NAME}-linux-x64.zip" .

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "DlnaServer-${GITHUB_REF_NAME}-linux-x64.zip"
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          --verify-tag
