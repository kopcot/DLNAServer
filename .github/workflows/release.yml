# Publish the deployable artifact for a tagged version.
#
# Tag with the product version - the `<Version>` in src/DlnaServer.Host/DlnaServer.Host.csproj - prefixed
# with `v`, as in `v1.1.0917`. The archive is
# the same framework-dependent linux-x64 publish NasBuild.sh produces by hand, so what a release contains
# is reproducible instead of being whatever was on the maintainer's machine that day.
#
# Two ways in: a `v*` tag pushed by hand, or tag-release.yml calling this with the tag it just created - a
# tag pushed with the workflow token starts no other workflow, so that one has to be called directly.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_call:
    inputs:
      tag:
        description: The existing `v*` tag to release.
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Least privilege at the workflow level. Only the publish job below elevates to contents: write, and
# only for the one step that needs it (gh release create) - restore, build and test run with no more
# access than a pull request gets.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and publish the artifact
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false - checkout otherwise leaves the token in .git/config for the rest of
      # the job, reachable by anything that runs afterwards (a compromised build step, a malicious
      # package's install script). Nothing after this step needs git access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DlnaServer.sln --locked-mode

      # The release must not ship something the build gate would have rejected.
      - name: Build and test
        run: |
          dotnet build DlnaServer.sln --configuration Release --no-restore -warnaserror
          dotnet test DlnaServer.sln --configuration Release --no-build

      # Mirrors NasBuild.sh: framework-dependent, because the NAS carries the .NET 8 runtime.
      - name: Publish
        run: >
          dotnet publish src/DlnaServer.Host
          --configuration Release
          --runtime linux-x64
          --no-self-contained
          --output publish
          -p:Deterministic=true
          -p:InvariantGlobalization=true

      - name: Archive
        run: |
          cd publish
          zip -r "../DlnaServer-${TAG}-linux-x64.zip" .

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-archive
          path: DlnaServer-${{ env.TAG }}-linux-x64.zip
          retention-days: 1

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest

    # The only job with write access, and only for as long as gh release create needs it.
    permissions:
      contents: write

    steps:
      # release-notes.md comes from the repository, so this job still needs a checkout - but never a
      # writable token: gh release create authenticates with GH_TOKEN below, not with git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Download the archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${TAG}"
          "DlnaServer-${TAG}-linux-x64.zip"
          --title "${TAG}"
          --notes-file release-notes.md
          --verify-tag

  smoke:
    name: Smoke test the published archive
    needs: publish
    runs-on: ubuntu-latest

    steps:
      # For the smoke-test script only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      # From the release itself rather than the build artifact, so this tests what an operator downloads.
      - name: Download the published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download "${TAG}"
          --repo "${GITHUB_REPOSITORY}"
          --pattern "DlnaServer-${TAG}-linux-x64.zip"

      # No source folder is configured, so the server falls back to its own folder - enough to prove it
      # starts, migrates a fresh database and answers on both ports.
      - name: Start the server
        run: |
          unzip -q "DlnaServer-${TAG}-linux-x64.zip" -d app
          (cd app && dotnet DlnaServer.Host.dll > ../server.log 2>&1 &)

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh

      - name: Server log
        if: always()
        run: cat server.log
