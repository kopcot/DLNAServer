version: 2

updates:
  # The transitive advisory that reached the NAS is the reason this file exists - see the
  # System.Security.Cryptography.Xml pin in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test:
        patterns:
          - "NUnit*"
          - "FluentAssertions"
          - "coverlet.*"
          - "NetArchTest.*"
    ignore:
      # Deliberately held in the 8.x band: net8.0 is the target and the 9.x line still carries most of
      # the same advisories, so moving forward is not the fix.
      - dependency-name: "System.Security.Cryptography.Xml"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in Dockerfile - the runtime image is what ships to the NAS.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The solution targets net8.0 and global.json pins the 8.0.4xx SDK, so a major bump of either
      # image produces a container that cannot run what it just built.
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: [ "version-update:semver-major" ]
