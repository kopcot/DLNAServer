version: 2

updates:
  # cooldown: a version must be public for 7 days before a PR proposes it, so a hijacked release is usually
  # caught and yanked first. Security updates are exempt and still arrive at once.
  # The transitive advisory that reached the NAS is the reason this file exists - see the
  # System.Security.Cryptography.Xml pin in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test:
        patterns:
          - "NUnit*"
          - "FluentAssertions"
          - "coverlet.*"
          - "NetArchTest.*"
      # SkiaSharp and its native assets move together, always - see Directory.Packages.props.
      skiasharp:
        patterns:
          - "SkiaSharp*"
    ignore:
      # Deliberately held in the 8.x band: net8.0 is the target and the 9.x line still carries most of
      # the same advisories, so moving forward is not the fix.
      - dependency-name: "System.Security.Cryptography.Xml"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
