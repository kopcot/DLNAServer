# The DLNA server with ONLY its admin pages on the internet, behind TLS and a password. Standalone: run it
# from this folder, with Caddyfile and .env beside it. The build context is the GitHub repository.
#
#   cp .env.example .env    # then fill in every required value - see README.md
#   docker compose up --build -d
#
# ---------------------------------------------------------------------------------------------------
# READ THIS FIRST
#
# The admin pages can restart the server, stop it, delete the index and rewrite config.json. The server
# itself has NO authentication of any kind - that is a deliberate trusted-LAN decision recorded in
# ManageController's own remarks. Everything protecting this is in the proxy below. If the password is
# weak, the admin UI is open.
#
# A VPN is the better answer and costs less to run. WireGuard on the router or the NAS gives you the
# admin pages, the media port, SSH and everything else, with no public surface at all. Use this file
# only when a VPN genuinely is not an option.
#
# WHAT THIS DOES NOT EXPOSE, and it is worth knowing why: /manage lives on the MEDIA port, not the admin
# port, and AdminSurfaceMiddleware enforces that separation for Blazor paths too. Verified against the
# running server - /manage/database answers 200 on 26852 and 404 on 26853. So publishing the admin port
# does not publish /manage/stop.
#
# The MEDIA PORT cannot be withheld: the dlna service needs network_mode: host for SSDP multicast, and
# Program.cs binds both ports with ListenAnyIP, so it is on every interface. Three things confine it, in
# the order a request meets them:
#   1. the HOST FIREWALL - keep the media port closed there;
#   2. the server's local-network check (ADR 0036) - the whole media port answers only the local network;
#   3. RejectRemoteManagementEndpointFilter - /manage refuses any non-private remote address.
# 2 and 3 are address checks, not authentication; this server has none by design.
#
# ADMIN_HOSTNAME below widens AllowedHosts for the whole PROCESS, not just the admin port -
# HostFilteringOptions has no per-port form - so it does not help confine the media port, and the hostname
# is not a secret: its Let's Encrypt certificate is published in the Certificate Transparency logs.
# ---------------------------------------------------------------------------------------------------

services:
  dlna:
    build:
      context: https://github.com/kopcot/DLNAServer.git#main
      dockerfile: Dockerfile
      # The Dockerfile names its base images by tag, so without this a rebuild reuses the cached copy and
      # keeps an old .NET patch - see docs/ADR/0037.
      pull: true
    image: kopcot/dlnaserver:latest
    container_name: dlna-server
    restart: unless-stopped

    # SSDP discovery is multicast and a bridge does not forward it - see Docker.usage.md. Host networking
    # also ignores `ports:`; both ports come from the variables below.
    network_mode: host

    # Match the owner of your media, or thumbnail writes fail - previews are written beside the media.
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # Read-write on purpose, see "Why the media mount is not read-only" in Docker.usage.md.
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media
      - dlna-data:/data
      - dlna-logs:/app/logs

    environment:
      Dlna__Server__Port: ${MEDIA_PORT:-26852}
      # The same variable Caddy proxies to below, so the two cannot disagree.
      Dlna__Server__AdminPort: ${ADMIN_PORT:-26853}
      # The media mount. While this line is here the Settings page shows /media again after every Save; to
      # manage the folder there, Save once and remove the line - a new volume's first config.json names /media.
      Dlna__Library__SourceFolders__0: /media
      # A bind mount usually delivers no inotify events for writes made outside the container.
      Dlna__Library__UsePeriodicRescan: "true"
      Dlna__Library__RescanIntervalMinutes: "5"
      # ffmpeg is in the image; on would download and execute an unverified binary.
      Dlna__Thumbnails__DownloadFFmpeg: "false"
      # Memory: the two database values folder 1 pins, because the first /data/config.json is written
      # with their code defaults, and these win over it. The FileCache switches are not pinned and stay
      # on. The page cache is charged per pooled connection - see "Memory" in Docker.usage.md.
      Dlna__Database__MemoryMapLimitInMegabytes: "0"
      Dlna__Database__CacheSizeInMegabytes: "2"
      TZ: ${TZ:-Europe/Prague}

      # WITHOUT THIS YOU GET A 400 AND NOTHING ELSE. AllowedHostsDefaults replaces the shipped wildcard
      # with loopback, this machine's name and its LAN addresses - a DNS-rebinding guard - so a request
      # arriving as dlna.example.com matches nothing and host filtering rejects it before any page runs.
      # Naming hosts explicitly is the documented escape hatch: Apply() returns early on a non-wildcard
      # list - and that is a trap of its own: naming ADMIN_HOSTNAME here means AllowedHostsDefaults never
      # runs at all, so its own LAN-address detection is skipped and a television reaching this same
      # process by the NAS's LAN IP or hostname (description.xml, SOAP, streaming - all one process, one
      # AllowedHosts) gets the same 400. LAN_HOSTS is that address list, named explicitly instead of
      # widening to "*", which would also defeat the DNS-rebinding guard this exists for. Semicolon-
      # separated. Keep localhost so the container's own healthcheck still passes.
      AllowedHosts: "${ADMIN_HOSTNAME:?set ADMIN_HOSTNAME in .env};localhost;127.0.0.1;${LAN_HOSTS:-}"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Below ~512m the SkiaSharp decode of a large photo fails rather than being slow.
    mem_limit: ${MEM_LIMIT:-1g}

  caddy:
    image: caddy:2-alpine
    # A tag, not a digest, so without this `up -d` keeps whichever 2.x was pulled first and never takes a
    # Caddy security fix. Same reasoning as the dlna service's `pull: true` - see docs/ADR/0037.
    pull_policy: always
    container_name: dlna-admin-proxy
    restart: unless-stopped

    # Host networking so it can reach the DLNA container on 127.0.0.1 - that container is on the host
    # stack too, because SSDP needs multicast. Caddy binds 80 and 443 on the host directly.
    network_mode: host

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    environment:
      # The name your certificate is issued for and the only name that will be answered.
      ADMIN_HOSTNAME: ${ADMIN_HOSTNAME:?set ADMIN_HOSTNAME in .env}

      # bcrypt hash, NOT the password. Generate it with cost 10-12, not the tool's default 14 - see
      # .env.example for why. Prefer the prompting form, it never puts the password in shell history:
      #     docker run --rm -it caddy:2-alpine caddy hash-password --cost 12
      # --plaintext 'your-password' works too, but leaves the password sitting in shell history.
      # Escape every $ as $$ when you paste it into .env, or compose will treat it as a variable.
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}

      ADMIN_PORT: ${ADMIN_PORT:-26853}

    depends_on:
      - dlna

    cap_drop:
      - ALL
    # Binding 80 and 443 is the one privilege it does need.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  dlna-data:
  dlna-logs:
  caddy-data:
  caddy-config:
